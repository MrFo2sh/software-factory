# Opens a "Factory run" issue every weekday with the next idea. Point any agent at the issue.
name: daily-factory-run
on:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:
permissions:
  issues: write
  contents: read
jobs:
  open-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - id: next
        run: |
          echo "body<<EOF" >> "$GITHUB_OUTPUT"
          node bin/factory.mjs next >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Factory run ${new Date().toISOString().slice(0,10)}`;
            const body = "Run the factory loop in AGENTS.md on this idea:\n\n```\n${{ steps.next.outputs.body }}\n```";
            await github.rest.issues.create({ ...context.repo, title, body, labels: ["factory-run"] });
